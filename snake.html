<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
         justify-content: center; background: #111; color: #eee; font-family: sans-serif; }
  canvas { background: #1b1b1b; border: 2px solid #4caf50; max-width: 95vw; touch-action: none; }
  #info { margin: 8px; font-size: 18px; }
</style>
</head>
<body>
<div id="info">ניקוד: <span id="score">0</span> | שיא: <span id="best">0</span></div>
<canvas id="c" width="400" height="400"></canvas>
<div id="info">חיצים / WASD לתנועה · רווח להתחלה/השהיה · החלקה במובייל</div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const N = 20, S = cv.width / N;
let snake, dir, nextDir, food, score, best = +localStorage.getItem('snakeBest') || 0;
let timer = null, running = false, over = false;
document.getElementById('best').textContent = best;

function reset() {
  snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
  dir = nextDir = {x: 1, y: 0};
  score = 0; over = false;
  document.getElementById('score').textContent = 0;
  placeFood(); draw();
}
function placeFood() {
  do { food = {x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N)}; }
  while (snake.some(s => s.x === food.x && s.y === food.y));
}
function start() {
  if (over) reset();
  if (running) return;
  running = true;
  timer = setInterval(step, 110);
}
function pause() { running = false; clearInterval(timer); draw(); }
function step() {
  dir = nextDir;
  const h = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N || snake.some(s => s.x === h.x && s.y === h.y)) {
    over = true; pause();
    if (score > best) { best = score; try { localStorage.setItem('snakeBest', best); } catch (e) {} }
    document.getElementById('best').textContent = best;
    draw(); return;
  }
  snake.unshift(h);
  if (h.x === food.x && h.y === food.y) {
    score++; document.getElementById('score').textContent = score; placeFood();
  } else snake.pop();
  draw();
}
function draw() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = '#e53935';
  ctx.fillRect(food.x * S + 2, food.y * S + 2, S - 4, S - 4);
  snake.forEach((s, i) => {
    ctx.fillStyle = i ? '#4caf50' : '#8bc34a';
    ctx.fillRect(s.x * S + 1, s.y * S + 1, S - 2, S - 2);
  });
  if (!running) {
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = '#fff'; ctx.font = '24px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(over ? 'Game Over - רווח למשחק חדש' : 'רווח / גע להתחלה', cv.width / 2, cv.height / 2);
  }
}
function turn(x, y) {
  if (x === -dir.x && y === -dir.y) return;
  nextDir = {x, y};
  if (!running) start();
}
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  const m = {arrowup: [0,-1], w: [0,-1], arrowdown: [0,1], s: [0,1],
             arrowleft: [-1,0], a: [-1,0], arrowright: [1,0], d: [1,0]}[k];
  if (m) { e.preventDefault(); turn(...m); }
  else if (k === ' ') { e.preventDefault(); running ? pause() : start(); }
});
let tx, ty;
cv.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; });
cv.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) < 20 && Math.abs(dy) < 20) { running ? pause() : start(); return; }
  Math.abs(dx) > Math.abs(dy) ? turn(Math.sign(dx), 0) : turn(0, Math.sign(dy));
});
reset();
</script>
</body>
</html>
